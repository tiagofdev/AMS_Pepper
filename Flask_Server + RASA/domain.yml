version: "3.1"



intents:
  - salutation
  - au_revoir
  - humeur_joyeuse
  - humeur_malheureuse
  - remerciement
  - affirm
  - challenger_robot
  - donner_nom
  - donner_age
  - donner_origine
  - donner_taille
  - donner_poids
  - renseignement_universite
  - renseignement_france
  - renseignement_avignon
  - demander_nom_robot
  - demander_origine_nom
  - demander_langues
  - demander_nationalite
  - demander_origine_nationalite
  - demander_caracteristiques
  - renseignement_robot
  - ask_restaurants_avignon
  - question_gpt
  - consulter_edt
  - la_section
  - le_groupe
  - la_date
  - consulter_salles_disponibles
  - heure_salle
  - orientation_batiment
  - la_place
  - envoyer_message_prof
  - nom_prof
  - deny
