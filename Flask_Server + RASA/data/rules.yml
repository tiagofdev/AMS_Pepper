#--------------------------------------------------------

- rule: Handle confirmation and clear slots
  condition:
    - slot_was_set:
        - confirm: true
  steps:
    - intent: affirm
    - action: utter_reposer_question

- rule: Socialiser avec l'utilisateur
  steps:
    - intent: socialisation
    - action: utter_socialisation

- rule: faire des blagues
  steps:
    - intent: blagues
    - action: utter_blagues

- rule: autres questions
  steps:
    - intent: autres_questions
    - action: action_deactivate_loop
    - active_loop: null
    - action: utter_autres_questions

- rule: demander souvenirs
  steps:
    - intent: demander_souvenirs
    - action: utter_partager_experiences

- rule: partager expérience
  steps:
    - intent: partager_une_experience
    - action: utter_cool

- rule: reponse pour demande d'alternance
  steps:
    - intent: ask_url_alternance
    - action: utter_donner_url_alternance
    - action: utter_cela_convient

- rule: Cancel any active form
  steps:
    - intent: cancel
    - action: action_deactivate_loop
    - active_loop: null
    - action: utter_cancelled

- rule: deviner_age
  steps:
    - intent: quel_age
    - action: utter_analyse

- rule: reponse remerciement
  steps:
    - intent: remerciement
    - action: utter_reponse_remerciement