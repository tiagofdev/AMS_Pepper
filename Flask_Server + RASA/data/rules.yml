version: "3.1"

rules:

- rule: saluer
  steps:
   - intent: salutation
   - action: utter_salutation

- rule: dites au revoir
  steps:
   - intent: au_revoir
   - action: action_deactivate_loop
   - active_loop: null
   - action: utter_au_revoir




- rule: répondre au challenge
  steps:
   - intent: challenger_robot
   - action: utter_challenge


- rule: renseignement université d'Avignon
  steps:
   - intent: renseignement_universite
   - action: utter_renseignement_universite

- rule: renseignement France
  steps:
   - intent: renseignement_france
   - action: utter_renseignement_france

- rule: renseignement ville d'Avignon
  steps:
   - intent: renseignement_avignon
   - action: utter_renseignement_avignon


- rule: réponse sur la langue du robot
  steps:
   - intent: demander_langues
   - action: utter_reponse_langues



- rule: répondre sur la caractéristiques du robot
  steps:
   - intent: demander_caracteristiques
   - action: utter_reponse_caracteristiques

- rule: renseignement sur le robot
  steps:
   - intent: renseignement_robot
   - action: utter_renseignement_robot

- rule: reponse sur question chatgpt
  steps:
    - intent: question_gpt
    - action: utter_renseignement_gpt

- rule: reponse restaurant avignon
  steps:
    - intent: ask_restaurants_avignon
    - action: utter_provide_restaurants_avignon



 #---------------------------------------- rule for edt

- rule: Activate edt form
  steps:
    - intent: consulter_edt
    - action: edt_form
    - active_loop: edt_form

- rule: Submit edt form
  condition:
    - active_loop: edt_form
  steps:
    - action: edt_form
    - active_loop: null
    - action: utter_submit
    - action: action_consulter_edt
    - action: utter_ask_confirmation
  wait_for_user_input: false

